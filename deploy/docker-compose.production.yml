services:
  oracle:
    image: ghcr.io/nostr-wot/nostr-wot-oracle:0.3.1
    container_name: nostr-wot-oracle
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - '127.0.0.1:8091:8080'
    volumes:
      - oracle-data:/app/data
    environment:
      DB_PATH: /app/data/wot.db
      HTTP_PORT: '8080'
      RELAYS: wss://relay.damus.io,wss://nos.lol,wss://relay.primal.net/,wss://relay.mostr.pub/
      RUST_LOG: info
      DVM_ENABLED: 'false'
      RATE_LIMIT_PER_MINUTE: '100'
      CACHE_SIZE: '10000'
      CACHE_TTL_SECS: '300'
    mem_limit: 2g
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/health']
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
volumes:
  oracle-data:
