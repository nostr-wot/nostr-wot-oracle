server {
    listen 80;
    listen [::]:80;
    server_name wot-oracle.mappingbitcoin.com;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wot-oracle.mappingbitcoin.com;
    ssl_certificate /etc/letsencrypt/live/wot-oracle.mappingbitcoin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wot-oracle.mappingbitcoin.com/privkey.pem;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }
}
